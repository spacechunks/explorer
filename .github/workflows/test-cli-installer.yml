name: test-cli-installer

on:
  push:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/test-cli-installer.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/test-cli-installer.yml"

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install the latest Explorer CLI
        env:
          EXPLORER_INSTALL_DIR: ${{ runner.temp }}/explorer-bin
          NO_COLOR: 1
        run: |
          ./scripts/install.sh
          echo "$EXPLORER_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: run the installed CLI
        run: explorer version

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the latest Explorer CLI
        shell: pwsh
        env:
          EXPLORER_INSTALL_DIR: ${{ runner.temp }}\explorer-bin
          NO_COLOR: 1
        run: |
          ./scripts/install.ps1
          $env:EXPLORER_INSTALL_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: run the installed CLI
        shell: pwsh
        run: explorerctl version
